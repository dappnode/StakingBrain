name: "Build and test"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production image
        run: docker buildx build --platform linux/${{ matrix.arch }} .
      - name: Build development image
        run: docker buildx build -f Dockerfile.brain.dev --platform linux/${{ matrix.arch }} .
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Lint and format and prettier
      - name: Lint
        run: yarn lint

      - name: Prettier
        run: yarn format:check

      # Build
      - name: Build
        run: yarn build

      # Test
      - name: Test
        run: yarn test
