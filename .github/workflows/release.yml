name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release (i.e. 0.1.0)"
        required: true

jobs:
  push-to-ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up Docker Buildx for multi-arch support
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build and push multi-arch Docker image
      - name: Build and push Staking brain docker monorepo
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/staking-brain:${{ github.event.inputs.tag }}

  gh-release:
    runs-on: ubuntu-latest
    needs: push-to-ghcr
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --title "Release v$RELEASE_TAG" --prerelease --generate-notes
